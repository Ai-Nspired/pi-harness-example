# SearXNG settings for the pi harness example. Only the keys listed here
# override the defaults; everything else comes from the image.
use_default_settings: true

general:
  instance_name: "pi-harness search"

server:
  # Replace before exposing this instance anywhere: openssl rand -hex 32
  secret_key: "CHANGE-ME-openssl-rand-hex-32"
  limiter: false
  public_instance: false

# DuckDuckGo's own engine timed out on every query we checked (2026-11-12), so
# it only added latency: it never contributed a result. The web_search tool
# still has DuckDuckGo's HTML and Lite endpoints as its own last resort.
engines:
  - name: duckduckgo
    disabled: true

search:
  safe_search: 0
  # `json` is what the web_search tool calls. SearXNG ships with html only,
  # which is why public instances answer format=json with an HTML error page.
  formats:
    - html
    - json
